services:
  gitea:
    image: gitea/gitea:1.23
    restart: unless-stopped
    environment:
      USER_UID: "${PUID}"
      USER_GID: "${PGID}"
      GITEA__database__DB_TYPE: sqlite3
    volumes:
      - ${BERTH_DATA}/data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:${HTTP_PORT}:3000"
      - "${SSH_PORT}:22"
