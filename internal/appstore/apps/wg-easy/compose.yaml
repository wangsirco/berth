services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ""
      PORT: "51821"
      WG_PORT: "${WG_PORT}"
    volumes:
      - ${BERTH_DATA}/data:/etc/wireguard
    ports:
      - "${WG_PORT}:51820/udp"
      - "127.0.0.1:${HTTP_PORT}:51821"
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
